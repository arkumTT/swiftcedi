services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: swiftcedi
      POSTGRES_PASSWORD: swiftcedi_dev
      POSTGRES_DB: swiftcedi_dev
    ports:
      - '5432:5432'
    volumes:
      - swiftcedi_pgdata:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d

volumes:
  swiftcedi_pgdata:
